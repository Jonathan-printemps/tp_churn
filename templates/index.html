<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Churn Prediction</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
            font-size: 2em;
        }
        
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.95em;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 0.95em;
        }
        
        input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
            font-family: inherit;
        }
        
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .result-container {
            margin-top: 30px;
            padding: 20px;
            border-radius: 5px;
            display: none;
        }
        
        .result-container.show {
            display: block;
        }
        
        .result-success {
            background-color: #e8f5e9;
            border-left: 4px solid #4caf50;
        }
        
        .result-danger {
            background-color: #ffebee;
            border-left: 4px solid #f44336;
        }
        
        .result-container h2 {
            margin-bottom: 10px;
            font-size: 1.3em;
        }
        
        .result-text {
            font-size: 1.1em;
            font-weight: 600;
        }
        
        .result-success .result-text {
            color: #2e7d32;
        }
        
        .result-danger .result-text {
            color: #c62828;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin-top: 15px;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-message {
            color: #c62828;
            font-size: 0.9em;
            margin-top: 5px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔮 Churn Prediction</h1>
        <p class="subtitle">Predict customer churn probability</p>
        
        <form id="predictionForm">
            <div class="form-group">
                <label for="age">Age (years)</label>
                <input type="number" id="age" name="Age" placeholder="Enter age" step="0.1" required>
            </div>
            
            <div class="form-group">
                <label for="accountManager">Account Manager</label>
                <select id="accountManager" name="Account_Manager" required>
                    <option value="">-- Select --</option>
                    <option value="0">No (0)</option>
                    <option value="1">Yes (1)</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="years">Years (with company)</label>
                <input type="number" id="years" name="Years" placeholder="Enter years" step="0.1" required>
            </div>
            
            <div class="form-group">
                <label for="numSites">Number of Sites</label>
                <input type="number" id="numSites" name="Num_Sites" placeholder="Enter number of sites" step="1" required>
            </div>
            
            <button type="submit">Predict Churn</button>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Making prediction...</p>
            </div>
        </form>
        
        <div class="result-container" id="resultContainer">
            <h2>Prediction Result</h2>
            <div class="result-text" id="resultText"></div>
        </div>
        
        <div class="error-message" id="errorMessage"></div>
    </div>
    
    <script>
        const form = document.getElementById('predictionForm');
        const resultContainer = document.getElementById('resultContainer');
        const resultText = document.getElementById('resultText');
        const errorMessage = document.getElementById('errorMessage');
        const loading = document.getElementById('loading');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Clear previous results and errors
            resultContainer.classList.remove('show');
            errorMessage.classList.remove('show');
            loading.classList.add('show');
            
            const formData = new FormData(form);
            
            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                loading.classList.remove('show');
                
                if (data.error) {
                    errorMessage.textContent = 'Error: ' + data.error;
                    errorMessage.classList.add('show');
                } else {
                    const churnPrediction = data.churn_prediction;
                    
                    if (churnPrediction === 1) {
                        resultContainer.classList.remove('result-success');
                        resultContainer.classList.add('result-danger');
                        resultText.textContent = '⚠️ Customer is likely to CHURN';
                    } else {
                        resultContainer.classList.remove('result-danger');
                        resultContainer.classList.add('result-success');
                        resultText.textContent = '✅ Customer is likely to STAY';
                    }
                    
                    resultContainer.classList.add('show');
                }
            } catch (error) {
                loading.classList.remove('show');
                errorMessage.textContent = 'Network error: ' + error.message;
                errorMessage.classList.add('show');
            }
        });
    </script>
</body>
</html>
